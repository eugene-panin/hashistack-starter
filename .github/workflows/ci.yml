---
name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE
  pull_request:
    paths-ignore:
      - README.md
      - CHANGELOG.md
      - LICENSE
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/eugene-panin/hashistack-starter

jobs:
  test:
    name: test (${{ matrix.answers }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        answers: [mail, minimal, ssh]
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: starter:test
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Check the test scripts
        run: docker run --rm -v "$PWD:/src" -w /src starter:test shellcheck -S warning test/check.sh test/bootstrap.sh image/entrypoint

      - name: Render and check inside the image
        run: docker run --rm -v "$PWD:/src" -w /src starter:test make test-${{ matrix.answers }}

  bootstrap:
    name: bootstrap an ssh server
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build the image
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: starter:test
          cache-from: type=gha

      - name: Start an Ubuntu server that only root can log in to
        run: |
          ssh-keygen -q -t ed25519 -N "" -f "$RUNNER_TEMP/id_ed25519"
          cp "$RUNNER_TEMP/id_ed25519.pub" test/target/authorized_keys
          docker build -t target:test test/target
          docker run -d --name target --privileged --cgroupns=host \
            -v /sys/fs/cgroup:/sys/fs/cgroup:rw -p 127.0.0.1:2222:22 target:test
          for _ in $(seq 30); do ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1 && break; sleep 2; done

      - name: Render the ssh answers and bootstrap the server from the image
        run: |
          docker run --rm --network host -v "$PWD:/src" -v "$RUNNER_TEMP:/keys" -w /src starter:test bash -c '
            out=$(mktemp -d)
            boilerplate --template-url template --output-folder "$out" --var-file test/ssh.yml \
              --var SshPublicKeyPath=/keys/id_ed25519.pub --non-interactive
            (cd "$out/ansible" && ansible-galaxy collection install -r requirements.yml -p .collections >/dev/null)
            test/bootstrap.sh "$out" /keys/id_ed25519 2222'

  publish:
    name: publish the image
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, bootstrap]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-qemu-action@v4

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ github.ref_name }}
            ${{ env.IMAGE }}:latest
          cache-from: type=gha
