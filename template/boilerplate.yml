required_version: ">= 0.16.0, < 1.0.0"

variables:
  - name: ProjectName
    description: Name of the new repository, also the Consul and Nomad datacenter and the ~/.config directory of its local files.
    order: 1
    validations:
      - required
      - regex("^[a-z][a-z0-9-]{1,40}$")

  - name: Provider
    description: "Where the server comes from: ovh rebuilds an OVH VPS through its API; ssh takes any Ubuntu server you can already log in to."
    type: enum
    options: [ovh, ssh]
    default: ovh
    order: 2

  - name: ServerIp
    description: Public address of the server (ssh only; ovh finds it through the API).
    default: ""
    order: 3

  - name: BootstrapUser
    description: User you log in to the server with today, root or a sudo user (ssh only).
    default: root
    order: 4

  - name: InfraDomain
    description: Domain of the internal names, whose DNS is on Cloudflare. Consul, Nomad and Vault answer as consul., nomad. and vault.<domain> through WireGuard.
    order: 5
    validations:
      - required
      - regex("^[a-z0-9-]+(\\.[a-z0-9-]+)+$")

  - name: AcmeEmail
    description: Contact address for the Let's Encrypt accounts.
    order: 6
    validations:
      - required
      - email

  - name: ServerAddress
    description: WireGuard address of the server, the first host of WireguardNetwork. Consul, Vault and Nomad listen on it.
    default: 10.77.0.1
    order: 7
    validations:
      - regex("^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.1$")

  - name: WireguardNetwork
    description: WireGuard network, a /24 that holds ServerAddress.
    default: 10.77.0.0/24
    order: 8
    validations:
      - regex("^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.0/24$")

  - name: WireguardClients
    description: Names of the WireGuard clients, such as your laptop; each gets the next address after ServerAddress.
    type: list
    default: [laptop]
    order: 9

  - name: PublicInterface
    description: Public network interface of the server (ip -brief address shows it).
    default: '{{ if eq .Provider "ovh" }}ens3{{ else }}eth0{{ end }}'
    order: 10

  - name: VpsImage
    description: OVH image the VPS is rebuilt with (ovh only).
    default: Ubuntu 24.04
    order: 11

  - name: OpsUser
    description: User Ansible logs in with; the rebuild or the bootstrap creates it.
    default: ops
    order: 12

  - name: SshPublicKeyPath
    description: SSH public key the ops user logs in with.
    default: ~/.ssh/id_ed25519.pub
    order: 13

  - name: MailEnabled
    description: Run a mail server.
    type: bool
    default: false
    order: 14

  - name: MailHostname
    description: Host name of the mail server, inside one of MailDomains; its A record and reverse DNS point to the server.
    default: mail.example.com
    order: 15

  - name: MailDomains
    description: Mail domains.
    type: list
    default: [example.com]
    order: 16

  - name: Mailboxes
    description: Mailboxes every mail domain gets; the first also receives postmaster@ and abuse@.
    type: list
    default: [info]
    order: 17

  - name: ManualDnsDomains
    description: Mail domains whose DNS is not on Cloudflare; their records are printed to be created by hand.
    type: list
    default: []
    order: 18

skip_files:
  - path: static
  - path: static/**/*
  - path: ovh-stack.hcl
    if: '{{ ne .Provider "ovh" }}'

hooks:
  after:
    - command: cp
      args: ["-R", "{{ templateFolder }}/static/common/.", "{{ outputFolder }}"]
    - command: cp
      args: ["-R", "{{ templateFolder }}/static/ovh/.", "{{ outputFolder }}"]
      skip: '{{ ne .Provider "ovh" }}'
    - command: cp
      args: ["-R", "{{ templateFolder }}/static/ssh/.", "{{ outputFolder }}"]
      skip: '{{ ne .Provider "ssh" }}'
