required_version: ">= 0.16.0, < 1.0.0"

variables:
  - name: ProjectName
    description: Name of the new repository, also the Consul and Nomad datacenter and the ~/.config directory of its local files.
    order: 1
    validations:
      - required
      - regex("^[a-z][a-z0-9-]{1,40}$")

  - name: InfraDomain
    description: Domain of the internal names, whose DNS is on Cloudflare. Consul, Nomad and Vault answer as consul., nomad. and vault.<domain> through WireGuard.
    order: 2
    validations:
      - required
      - regex("^[a-z0-9-]+(\\.[a-z0-9-]+)+$")

  - name: AcmeEmail
    description: Contact address for the Let's Encrypt accounts.
    order: 3
    validations:
      - required
      - email

  - name: ServerAddress
    description: WireGuard address of the server, the first host of WireguardNetwork. Consul, Vault and Nomad listen on it.
    default: 10.77.0.1
    order: 4
    validations:
      - regex("^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.1$")

  - name: WireguardNetwork
    description: WireGuard network, a /24 that holds ServerAddress.
    default: 10.77.0.0/24
    order: 5
    validations:
      - regex("^[0-9]{1,3}\\.[0-9]{1,3}\\.[0-9]{1,3}\\.0/24$")

  - name: WireguardClients
    description: Names of the WireGuard clients, such as your laptop; each gets the next address after ServerAddress.
    type: list
    default: [laptop]
    order: 6

  - name: PublicInterface
    description: Public network interface of the VPS.
    default: ens3
    order: 7

  - name: VpsImage
    description: OVH image the VPS is rebuilt with.
    default: Ubuntu 24.04
    order: 8

  - name: OpsUser
    description: User the rebuild creates for SSH and Ansible.
    default: ops
    order: 9

  - name: SshPublicKeyPath
    description: SSH public key the ops user logs in with.
    default: ~/.ssh/id_ed25519.pub
    order: 10

  - name: MailEnabled
    description: Run a mail server.
    type: bool
    default: false
    order: 11

  - name: MailHostname
    description: Host name of the mail server, inside one of MailDomains; its A record and reverse DNS point to the VPS.
    default: mail.example.com
    order: 12

  - name: MailDomains
    description: Mail domains.
    type: list
    default: [example.com]
    order: 13

  - name: Mailboxes
    description: Mailboxes every mail domain gets; the first also receives postmaster@ and abuse@.
    type: list
    default: [info]
    order: 14

  - name: ManualDnsDomains
    description: Mail domains whose DNS is not on Cloudflare; their records are printed to be created by hand.
    type: list
    default: []
    order: 15

skip_files:
  - path: static
  - path: static/**/*

hooks:
  after:
    - command: cp
      args: ["-R", "{{ templateFolder }}/static/.", "{{ outputFolder }}"]
